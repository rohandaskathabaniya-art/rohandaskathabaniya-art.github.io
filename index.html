<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rohan Das Kathabaniya</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080b14;
    font-family: Arial, sans-serif;
}

.name {
    position: relative;
    font-size: clamp(32px, 7vw, 80px);
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;

    background: linear-gradient(
        90deg,
        #ffffff,
        #8ab4ff,
        #ffffff,
        #8ab4ff,
        #ffffff
    );

    background-size: 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation:
        gradientMove 5s linear infinite,
        nameFloat 3s ease-in-out infinite;

    text-align: center;
    filter: drop-shadow(0 0 15px rgba(100,160,255,.45));
}

/* Moving shine */
.name::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.8),
        transparent
    );

    transform: skewX(-20deg);
    animation: shine 3.5s infinite;
}

/* Gradient movement */
@keyframes gradientMove {
    0% {
        background-position: 0%;
    }

    100% {
        background-position: 300%;
    }
}

/* Gentle floating */
@keyframes nameFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

/* Shine animation */
@keyframes shine {
    0% {
        left: -100%;
    }

    45%, 100% {
        left: 150%;
    }
}

/* Mobile */
@media (max-width: 600px) {
    .name {
        letter-spacing: 2px;
        font-size: 30px;
    }
}
</style>
</head>

<body>

<h1 class="name">
    Rohan Das Kathabaniya
</h1>

</body>
